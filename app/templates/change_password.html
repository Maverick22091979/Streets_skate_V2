<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Cambio password - {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/login.css?v={{ asset_version }}">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <div class="brand-icon">GPS</div>
        <div>
          <h1>Cambio password</h1>
          <p>Primo accesso per <strong>{{ username }}</strong>. Imposta subito una password definitiva.</p>
        </div>
      </div>

      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}

      <form class="admin-form" method="post" action="/change-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>
          Password attuale
          <input type="password" name="current_password" autocomplete="current-password" required>
        </label>
        <label>
          Nuova password
          <input type="password" name="new_password" autocomplete="new-password" required>
        </label>
        <label>
          Conferma nuova password
          <input type="password" name="confirm_password" autocomplete="new-password" required>
        </label>
        <button type="submit">Salva nuova password</button>
      </form>

      <div class="provider-notes">
        <h2>Regole minime password</h2>
        <div class="provider-note-list">
          <article class="provider-note">
            <small>Almeno 8 caratteri</small>
            <small>Almeno 1 lettera maiuscola</small>
            <small>Almeno 1 lettera minuscola</small>
            <small>Almeno 1 numero</small>
            <small>Almeno 1 carattere speciale</small>
          </article>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/js/session-guard.js?v={{ asset_version }}" data-session-guard data-csrf="{{ csrf_token }}" data-timeout="{{ session_inactivity_timeout_sec }}"></script>
</body>
</html>
