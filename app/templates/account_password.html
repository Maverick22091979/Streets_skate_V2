<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Password account - {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/login.css?v={{ asset_version }}">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <div class="brand-icon">GPS</div>
        <div>
          <h1>Cambio password</h1>
          <p>Account <strong>{{ username }}</strong>. Aggiorna la password in qualsiasi momento.</p>
        </div>
      </div>

      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}
      {% if status %}
      <div class="gpx-upload-state">{{ status }}</div>
      {% endif %}

      <form class="admin-form" method="post" action="/account/password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>
          Password attuale
          <input type="password" name="current_password" autocomplete="current-password" required>
        </label>
        <label>
          Nuova password
          <input type="password" name="new_password" autocomplete="new-password" required>
        </label>
        <label>
          Conferma nuova password
          <input type="password" name="confirm_password" autocomplete="new-password" required>
        </label>
        <button type="submit">Aggiorna password</button>
      </form>

      <div class="register-link-wrap">
        <a class="register-link" href="/dashboard">Torna alla dashboard</a>
      </div>
    </section>
  </main>
  <script src="/static/js/session-guard.js?v={{ asset_version }}" data-session-guard data-csrf="{{ csrf_token }}" data-timeout="{{ session_inactivity_timeout_sec }}"></script>
</body>
</html>
